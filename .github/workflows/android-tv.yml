name: Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/RemoteDesktopTV.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopTV-apk
          path: android-tv/dist/RemoteDesktopTV.apk

      # Keep a downloadable copy of the latest build in the repo itself.
      - name: Commit APK
        if: github.event_name == 'push' && github.ref_type == 'branch'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android-tv/dist/RemoteDesktopTV.apk
          if git diff --cached --quiet; then echo "No APK change"; exit 0; fi
          git commit -m "Android TV: build APK [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
