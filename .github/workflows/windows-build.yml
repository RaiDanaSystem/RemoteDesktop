name: Windows app build

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The OpenH264 binary is not stored in git (see .gitignore); a placeholder is enough to compile-check.
      - name: Placeholder for the native OpenH264 DLL
        shell: pwsh
        run: |
          $p = 'src/Shared/Native/openh264-2.4.0-win64.dll'
          if (-not (Test-Path $p)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $p) | Out-Null
            New-Item -ItemType File -Path $p | Out-Null
          }

      - name: Build SupportAgent (includes Shared + CustomerAgent)
        run: dotnet build src/SupportAgent/SupportAgent.csproj -c Release -nologo
