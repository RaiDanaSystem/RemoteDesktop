version: "3.8"

services:
  coturn:
    image: coturn/coturn:4.6
    container_name: raidana-turn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=${TURN_SECRET:-raidana-dev-turn-secret-change-me}
      - TURN_REALM=${TURN_REALM:-raidana.local}
    command: >
      -c /etc/coturn/turnserver.conf
    networks:
      - raidana-net

networks:
  raidana-net:
    driver: bridge
