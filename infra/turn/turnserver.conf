# Coturn development configuration for RemoteDesktopRaidana
# NOT for production — uses static credentials and permissive settings

# Network
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
relay-ip=0.0.0.0
external-ip=EXTERNAL_IP

# Realm
realm=raidana.local

# Authentication (use shared secret — clients get ephemeral credentials via server)
use-auth-secret
static-auth-secret=raidana-dev-turn-secret-change-me

# TLS (disabled for development)
no-tls
no-dtls

# Relay ports range
min-port=49152
max-port=65535

# Logging
log-file=/var/log/coturn/turnserver.log
simple-log
verbose

# Security (relaxed for development)
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Performance
cli-password=raidana-cli
